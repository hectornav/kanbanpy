# Kanbanpy Pro — self-hosted on your NAS.
#
#   1. Copy .env.example to .env and set KANBAN_SECRET_KEY (see the file).
#   2. docker compose up -d --build
#   3. Open http://<nas-ip>:8000  (or your Tailscale hostname — see below).
#
services:
  kanban:
    build: .
    image: kanbanpy-pro:2.0
    container_name: kanbanpy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # REQUIRED in production. Generate once with:
      #   python -c "import secrets; print(secrets.token_hex(32))"
      KANBAN_SECRET_KEY: ${KANBAN_SECRET_KEY:?Set KANBAN_SECRET_KEY in .env}
      KANBAN_ENV: production
      # Postgres on the shared postgres-shared container (same pattern as
      # PlayMusic) -- see /srv/docker/postgres-shared/docker-compose.yml.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      # Lock CORS to your own origins once you know them; "*" is fine on a
      # private Tailscale network.
      KANBAN_CORS_ORIGINS: ${KANBAN_CORS_ORIGINS:-*}
      # Web Push (optional). Generate with: cd server && python gen_vapid.py >> ../.env
      KANBAN_VAPID_PUBLIC_KEY: ${KANBAN_VAPID_PUBLIC_KEY:-}
      KANBAN_VAPID_PRIVATE_KEY: ${KANBAN_VAPID_PRIVATE_KEY:-}
      KANBAN_VAPID_SUBJECT: ${KANBAN_VAPID_SUBJECT:-mailto:admin@kanbanpy.local}
      # AI planner (optional). Provider: "anthropic" (cloud) or "ollama" (local).
      KANBAN_AI_PROVIDER: ${KANBAN_AI_PROVIDER:-anthropic}
      KANBAN_ANTHROPIC_API_KEY: ${KANBAN_ANTHROPIC_API_KEY:-}
      KANBAN_ANTHROPIC_MODEL: ${KANBAN_ANTHROPIC_MODEL:-claude-opus-4-8}
      KANBAN_OPENAI_BASE_URL: ${KANBAN_OPENAI_BASE_URL:-https://api.openai.com/v1}
      KANBAN_OPENAI_API_KEY: ${KANBAN_OPENAI_API_KEY:-}
      KANBAN_OPENAI_MODEL: ${KANBAN_OPENAI_MODEL:-gpt-4o-mini}
      KANBAN_OLLAMA_URL: ${KANBAN_OLLAMA_URL:-http://host.docker.internal:11434}
      KANBAN_OLLAMA_MODEL: ${KANBAN_OLLAMA_MODEL:-llama3.1}
    # Lets the container reach an Ollama running on the NAS host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Legacy SQLite data dir -- kept mounted through the Postgres cutover
      # for rollback safety; safe to drop once Postgres has been confirmed
      # stable for a while.
      - kanban-data:/data
    networks:
      - default          # keep talking to nothing else internally
      - pg_net_kanbanpy  # reach the shared postgres-shared container

# ── Accessing it from your phone anywhere, without opening ports ──────────────
# Recommended: install Tailscale on the NAS host and on your phone. Then reach
# the board at http://<nas-hostname>.<tailnet>.ts.net:8000 from anywhere.
#
# If you prefer a Tailscale sidecar instead of host install, uncomment below and
# provide a TS_AUTHKEY in .env, then point the app at network_mode: service:ts.
#
#  ts:
#    image: tailscale/tailscale:latest
#    container_name: kanban-ts
#    hostname: kanban
#    environment:
#      TS_AUTHKEY: ${TS_AUTHKEY}
#      TS_STATE_DIR: /var/lib/tailscale
#    volumes:
#      - ts-state:/var/lib/tailscale
#    cap_add: [net_admin, sys_module]
#    restart: unless-stopped

networks:
  pg_net_kanbanpy:
    external: true

volumes:
  kanban-data:
#  ts-state:
